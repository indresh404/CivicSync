version: '3.8'

services:
  # Optional PostgreSQL service for production relational persistence
  postgres:
    image: postgres:16-alpine
    container_name: digsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: digsync
      POSTGRES_USER: digsync_user
      POSTGRES_PASSWORD: digsync_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digsync_user -d digsync"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service (PORT=5000)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: digsync-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb+srv://tenpointeradmin:indresh200630@cluster0.up2l13c.mongodb.net/?appName=Cluster0
      - JWT_SECRET=mySuperSecretKey
      - DATABASE_URL=postgresql://digsync_user:digsync_password@postgres:5432/digsync
      - CONFLICT_THRESHOLD_METERS=50.0
      - ASSUMED_COST_PER_REDIG=350000.0
      - COOLDOWN_MONTHS=24
      - MONSOON_START=06-01
      - MONSOON_END=09-30
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
